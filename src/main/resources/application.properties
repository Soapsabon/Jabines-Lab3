# Server
server.port=8080
server.servlet.context-path=/api

# Database - Supabase PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/jabines_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=10
spring.jpa.properties.hibernate.order_inserts=true

# Logging
logging.level.root=INFO
logging.level.edu.cit.jabines=DEBUG
logging.level.org.springframework.web=INFO

# LegacySupply Configuration
legacysupply.base-url=${LS_BASE_URL:https://legacysupply.onrender.com/api/v1}
legacysupply.api-key=${LS_API_KEY:}
legacysupply.client-id=${LS_CLIENT_ID:22-4660-812}
legacysupply.timeout-seconds=3
legacysupply.max-retries=3

# Scheduled tasks
app.scheduler.retry-interval-minutes=5
app.scheduler.status-check-interval-minutes=10
